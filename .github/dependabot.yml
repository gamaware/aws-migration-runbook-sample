version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/production
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
