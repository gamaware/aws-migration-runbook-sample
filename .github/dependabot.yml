version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-all:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/production
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-all:
        group-by: dependency-name
        patterns: ["*"]
