[project]
name = "aws-migration-runbook-sample"
version = "1.0.0"
description = "Consistency checks and evidence builders for the Harbor Goods migration sample."
requires-python = ">=3.13"
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
