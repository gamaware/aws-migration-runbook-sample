# Target sizing and addressing for wave 1. Terraform reads this file (infra/terraform/envs/production), so the
# numbers the sizing check validates are the numbers that get deployed.

region: us-east-1
# Two Availability Zones, named explicitly so the subnet layout never changes when AWS adds a zone.
availability_zones: [us-east-1a, us-east-1b]
vpc_cidr: 10.60.0.0/16
onprem_cidr: 10.40.0.0/16
onprem_vpn_peer_ip: 203.0.113.20
onprem_bgp_asn: 65010
hosted_zone: example.com

# The storefront, already on AWS in this account, calls api.example.com from its own VPC. A VPC peering connection
# carries those calls to the internal load balancer after the switch, and the private hosted zones (one per record name)
# are associated with that VPC so it resolves the weighted records.
storefront_vpc:
  id: vpc-0a1b2c3d4e5f67890
  cidr: 10.50.0.0/16

# The parcel carrier publishes the fixed addresses of its label API. The API tasks reach only these through the NAT
# gateways; every other call to AWS stays inside the VPC through VPC endpoints.
carrier_api_cidrs: [203.0.113.200/32, 203.0.113.201/32]

# The load balancer is internal, so its access logs go to the central log archive bucket that the security team owns
# in the log archive account. ALB access logging supports only SSE-S3; that bucket's encryption, retention and Object
# Lock are managed there, not in this workload.
alb_access_logs:
  bucket: harbor-log-archive-777788889999-us-east-1
  prefix: harbor-prod/alb

# Records that move in wave 1. onprem_value must match data/synthetic/dns-records.csv.
records:
  - name: warehouse.example.com
    onprem_value: 203.0.113.10
    service: web
  - name: api.example.com
    onprem_value: 203.0.113.11
    service: api

# Sizing rule (scripts/check_plan.py): per source server, task vCPU >= vCPU x p95 CPU x 1.25 and task memory >=
# RAM x p95 memory x 1.25. Each ECS task replaces one server, so desired_count equals the number of sources.
services:
  web:
    sources: [SRV-03, SRV-04]
    cpu: 1024
    memory: 3072
    desired_count: 2
    container_port: 8080
    health_check_path: /healthz
  api:
    sources: [SRV-05, SRV-06]
    cpu: 2048
    memory: 6144
    desired_count: 2
    container_port: 8080
    health_check_path: /actuator/health

# Sizing rule: vCPU >= source vCPU x p95 CPU x 1.25; memory >= source RAM x p95 memory (the p95 is mostly page
# cache, which the RDS instance rebuilds); allocated storage >= 2 x the source database size.
database:
  source: SRV-07
  engine_version: "16"
  instance_class: db.r7g.2xlarge
  instance_vcpu: 8
  instance_memory_gb: 64
  allocated_storage_gb: 400
  max_allocated_storage_gb: 1000
  multi_az: true
  backup_retention_days: 14
